    <meta name="description" content="সিলেট ও সারা বাংলাদেশের জন্য ১০০% খাঁটি, প্রাকৃতিক ও অর্গানিক খাদ্যপণ্য। হোম ডেলিভারি ও ক্যাশ অন ডেলিভারি সুবিধা।" />

    <meta property="og:description" content="খাঁটি মধু, খাঁটি গাওয়া ঘি, যশোরের খেজুর গুড়, কোল্ড প্রেসড সরিষার তেল ও প্রিমিয়াম অর্গানিক পণ্য।" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    
    <!-- GitHub Pages Single Page App routing support -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
