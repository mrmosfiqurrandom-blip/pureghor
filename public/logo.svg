<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="100%" height="100%">
  <defs>
    <!-- Leaf Gradients / Flat Clean Colors matching the exact PureGhor Logo -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64C408"/>
      <stop offset="100%" stop-color="#4FA602"/>
    </linearGradient>
  </defs>

  <!-- Left Icon: Stylized 'P' with Organic Leaf Inlay and Sprout -->
